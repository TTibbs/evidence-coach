<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evidence Coach Capture</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <p class="eyebrow">Evidence Coach</p>
        <h1>Capture job description</h1>
      </header>

      <section class="status-panel" aria-live="polite">
        <p id="status">Capture the active tab, then review it in the app.</p>
      </section>

      <section class="settings-panel" aria-label="Capture settings">
        <div>
          <h2>LinkedIn prompt</h2>
          <p>Show the on-page capture prompt on LinkedIn job pages.</p>
        </div>
        <label class="switch">
          <input id="prompt-toggle" type="checkbox" />
          <span>Enabled</span>
        </label>
      </section>

      <details class="preview disclosure" hidden open>
        <summary>
          <span>Captured description</span>
          <span id="description-count">Ready</span>
        </summary>
        <div class="panel-body">
          <textarea
            id="description"
            rows="8"
            aria-label="Captured description"
          ></textarea>
          <dl>
            <div>
              <dt>Role</dt>
              <dd id="title">-</dd>
            </div>
            <div>
              <dt>Source</dt>
              <dd id="source">-</dd>
            </div>
          </dl>
        </div>
      </details>

      <details id="trust-panel" class="trust-panel disclosure" hidden open>
        <summary>
          <span>Job confidence</span>
          <span id="trust-badge">Checking</span>
        </summary>
        <div class="panel-body">
          <p id="trust-summary">Checking job confidence...</p>
          <ul id="trust-signals"></ul>
          <a
            id="official-search"
            class="inline-action"
            href="#"
            target="_blank"
            rel="noreferrer"
            hidden
          >
            Search official listing
          </a>
        </div>
      </details>

      <div class="actions">
        <button id="capture" class="button primary" type="button">Capture page</button>
        <button id="open" class="button secondary" type="button" disabled>
          Open in app
        </button>
        <button id="copy" class="button ghost" type="button" disabled>
          Copy text
        </button>
      </div>
    </main>
  </body>
</html>
